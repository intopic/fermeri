[workspace]
resolver = "2"
members = [
    "crates/zilja-verifier",
    "crates/zilja-tree",
    "crates/zilja-store",
    "crates/zilja-node",
    "crates/zilja-plugin",
    "crates/zilja-wasm",
    "crates/zilja-bench",
    "crates/zilja-cli",
    "crates/zilja-aggregator",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/intopic/fermeri"

[workspace.dependencies]
sha2 = { version = "0.10", default-features = false }
rayon = "1.10"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bs58 = "0.5"
hex = "0.4"
log = "0.4"
rand = "0.8"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
zilja-verifier = { path = "crates/zilja-verifier" }
zilja-tree = { path = "crates/zilja-tree" }
zilja-node = { path = "crates/zilja-node" }
zilja-store = { path = "crates/zilja-store" }
zilja-cli = { path = "crates/zilja-cli" }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release-wasm]
inherits = "release"
opt-level = "z"
lto = true
panic = "abort"
strip = true
