name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  AGAVE_VERSION: v4.3.2

jobs:
  test:
    name: Testet (Rust + JS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (versioni nga rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (pa paralajmërime, L8)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-features
      - name: testi i rrymës që ikën (pema në disk, pages)
        run: cargo run -q --release -p zilja-bench --bin zilja-crash-test -- 6
      - name: vrasje gjatë ndërtimit nga snapshot-i (Safer-6)
        run: cargo run -q --release -p zilja-bench --bin zilja-crash-test -- --snapshot 6
      - name: fuzz diferencial i motorit me faqe (3 min)
        run: cargo run -q --release -p zilja-bench --bin zilja-fuzz -- 180
      - name: vektorët në repo = vektorët që gjeneron Rust
        run: |
          cargo run -q -p zilja-bench --bin zilja-vectors > sdk/js/test/vectors.json
          git diff --exit-code sdk/js/test/vectors.json
          cargo run -q -p zilja-bench --bin zilja-wire-vectors > sdk/js/test/wire-vectors.json
          git diff --exit-code sdk/js/test/wire-vectors.json
          node sdk/js/test/gen-policy-vectors.mjs > sdk/js/test/policy-vectors.json
          git diff --exit-code sdk/js/test/policy-vectors.json
      - name: SDK zilja-verify (npm test + pack)
        working-directory: sdk/js
        run: |
          npm test
          npm pack --dry-run

  wasm:
    name: Verifikuesi WASM (madhësia)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (versioni nga rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build -p zilja-wasm --target wasm32-unknown-unknown --profile release-wasm
      - name: madhësia (objektivi < 500 KB)
        run: |
          f=target/wasm32-unknown-unknown/release-wasm/zilja_wasm.wasm
          size=$(stat -c %s "$f")
          echo "zilja_wasm.wasm: $size bajt" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$size" -lt 512000

  e2e:
    name: Testi i plotë mbi solana-test-validator (disk=${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        db: ["0", "pages"]
    steps:
      - uses: actions/checkout@v4
      - name: Rust (versioni nga rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: build plugin + cli + aggregator + snapshot-bench
        run: |
          cargo build --release -p zilja-plugin -p zilja-cli -p zilja-aggregator
          cargo build --release -p zilja-bench --bin zilja-snapshot-bench
      - name: shkarko Agave
        run: |
          curl -sSL -o agave.tar.bz2 "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar xjf agave.tar.bz2
      - name: e2e
        run: ZILJA_DB=${{ matrix.db }} WORK=$RUNNER_TEMP/e2e scripts/e2e-test-validator.sh "$PWD/solana-release/bin"

  release:
    name: Release pa RocksDB dhe pa libclang (A21, A09, R6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (versioni nga rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - name: grafiku i varësive të release-it pa rocksdb/bindgen/clang-sys
        run: |
          cargo tree -p zilja-plugin -e normal,build --target x86_64-unknown-linux-gnu > tree.txt
          cargo tree -p zilja-cli -e normal,build --target x86_64-unknown-linux-gnu >> tree.txt
          if grep -iE "rocksdb|bindgen|clang-sys" tree.txt; then echo "release-i përmban motorin e vjetër"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: paketa e release-it pa libclang, e ndërtuar dy herë (A09, A21, A23, A25)
        run: |
          if ldconfig -p | grep -q libclang; then sudo apt-get remove -y -q 'libclang*' || true; fi
          scripts/release.sh dist
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          m = json.load(open(glob.glob("dist/*/MANIFEST.json")[0]))
          print(f"### Release {m['commit'][:12]} (zyrtar: {m['official']})")
          print("```"); print("\n".join(m["rustc"])); print("```")
          for k, v in m["artifacts"].items(): print(f"- `{k}` {v['bytes']} B `{v['sha256'][:16]}…`")
          j = m["sdk_js"]
          print(f"- SDK npm: {j['npm_tarball_bytes']} B tarball, {j['npm_unpacked_bytes']} B i shpaketuar; bundle {j['bundle_full_min_gzip_bytes']} B gzip (vetëm verifikuesi {j['bundle_verify_only_min_gzip_bytes']} B gzip)")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: zilja-release
          path: dist/*.tar.gz
