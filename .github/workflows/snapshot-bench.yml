name: snapshot-bench

# Benchmark-u mbi një snapshot të vërtetë Solana (zilja-snapshot-bench).
#
# - smoke (GitHub, falas): arkivi lexohet direkt nga rrjeti (curl | bench), vetëm `limit` rekordet e
#   para (runner-i ka 14 GB disk). Provon parser-in mbi të dhëna reale dhe se dëftesat verifikohen.
#   S'jep numrat e prodhimit: makina është virtuale dhe e ndarë.
# - full (self-hosted): snapshot-i i plotë në makinën tënde (etiketa `zilja-bench`), me numrat realë.
#   Shih docs/OPERIMI.md, "Benchmark mbi një snapshot të vërtetë".

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = GitHub, me limit · full = runner-i yt self-hosted (etiketa zilja-bench)"
        type: choice
        options: [smoke, full]
        default: smoke
      snapshot_url:
        description: "URL e snapshot-it (.tar.zst, ose një /snapshot.tar.bz2 që ridrejton te .tar.zst)"
        default: "https://api.testnet.solana.com/snapshot.tar.bz2"
      limit:
        description: "smoke: sa rekorde të lexohen (full: injorohet)"
        default: "3000000"
      updates:
        description: "ndryshime për slot, të ndara me presje"
        default: "5000,15000,30000"
      slots:
        description: "slote për çdo profil (≥ 257 përfshin një checkpoint)"
        default: "300"
      proofs:
        default: "5000"
      rpc_clients:
        description: "dëftesa nga shumë klientë njëkohësisht (p.sh. 1,8,32,128; bosh = pa këtë fazë)"
        default: "1,8,32"
      rpc_seconds:
        default: "20"
      cold:
        description: "cache-i i sistemit: none = ngrohtë · profile = bosh para çdo profili · slot = bosh para çdo sloti (rasti më i keq)"
        type: choice
        options: [none, profile, slot]
        default: none
  schedule:
    # Çdo të hënë: kontroll i formatit mbi Testnet (nëse Agave ndryshon AppendVec-un, dështon këtu).
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    if: github.event_name == 'schedule' || inputs.mode == 'smoke'
    name: smoke (GitHub, ${{ inputs.limit || '3000000' }} rekorde)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Rust (versioni nga rust-toolchain.toml)
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: build
        run: cargo build --release -p zilja-bench --bin zilja-snapshot-bench
      - name: bench (streaming nga rrjeti)
        env:
          URL: ${{ inputs.snapshot_url || 'https://api.testnet.solana.com/snapshot.tar.bz2' }}
          LIMIT: ${{ inputs.limit || '3000000' }}
          UPDATES: ${{ inputs.updates || '5000' }}
          SLOTS: ${{ inputs.slots || '300' }}
          PROOFS: ${{ inputs.proofs || '2000' }}
          COLD: ${{ inputs.cold || 'none' }}
          RPC_CLIENTS: ${{ github.event_name == 'schedule' && '1,8,32' || inputs.rpc_clients }}
          RPC_SECONDS: ${{ inputs.rpc_seconds || '20' }}
        run: |
          RPC=(); [ -n "$RPC_CLIENTS" ] && RPC=(--rpc-clients "$RPC_CLIENTS" --rpc-seconds "$RPC_SECONDS" --rpc-one-ip)
          mkdir -p "$RUNNER_TEMP/out"
          echo "snapshot: $(curl -sIL -o /dev/null -w '%{url_effective}' "$URL")"
          # Bench-i ndalon pas LIMIT rekordesh; curl merr pastaj SIGPIPE: vlen statusi i bench-it.
          curl -fsSL --retry 3 "$URL" | ./target/release/zilja-snapshot-bench - "$RUNNER_TEMP/db" \
            --out "$RUNNER_TEMP/out/results.csv" --limit "$LIMIT" --cache-depth 20 \
            --slots "$SLOTS" --updates "$UPDATES" --proofs "$PROOFS" --cold "$COLD" "${RPC[@]}" > "$RUNNER_TEMP/out/stdout.json"
          st=${PIPESTATUS[1]}
          [ "$st" = 0 ] || { echo "bench-i dështoi ($st)"; exit "$st"; }
      - name: grafikët dhe përmbledhja
        if: always()
        run: |
          pip install -q matplotlib || true
          python3 scripts/plot-bench.py "$RUNNER_TEMP/out/results.csv" || true
          python3 - "$RUNNER_TEMP/out/summary.json" <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import json, sys
          s = json.load(open(sys.argv[1]))
          print(f"### Snapshot {s['snapshot_slot']}: {s['accounts']:,} llogari (smoke, me limit)")
          print(f"- ndërtimi: {s['build']['finish_seconds']:.0f} s, RAM maksimal {s['build']['hwm_mb']:.0f} MB, maja e blloqeve {s['build']['packer_peak_blocks']}")
          for k, v in s.get("slots", {}).items():
              t = v["total_ms"]; r = v.get("read_ms", {}); c = v.get("checkpoint_ms", {})
              print(f"- {int(k):,}/slot: p50 {t['p50']:.1f} ms, p99 {t['p99']:.1f} ms, max {t['max']:.1f} ms · leximi p50 {r.get('p50', 0):.1f} ms · {c.get('n', 0)} checkpoint-e (max {c.get('max', 0):.1f} ms) · cache {v.get('os_cache_hit_pct', 100):.0f}%")
          for x in s.get("warnings", []): print(f"- **KUJDES**: {x}")
          for l in (s.get("rpc") or {}).get("levels", []):
              print(f"- RPC {l['clients']} klientë{' nga 1 IP' if l['one_ip'] else ''}: {l['proofs_per_second']:,.0f} dëftesa/s, p99 {l['latency_ms'].get('p99', 0):.2f} ms, gabime {l['error_pct']:.2f}%, verifikuar {l['verified']} (të pavlefshme {l['invalid']})")
          p = s.get("proofs")
          if p: print(f"- dëftesa: {p['n']} (të pavlefshme: {p['invalid']}), {p['bytes']['p50']:.0f} B p50")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-bench-smoke
          path: ${{ runner.temp }}/out

  full:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    name: full (self-hosted)
    runs-on: [self-hosted, linux, zilja-bench]
    timeout-minutes: 2880
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: cargo build --release -p zilja-bench --bin zilja-snapshot-bench
      - name: bench (snapshot i plotë, streaming)
        # G05: inputet kalojnë vetëm si env dhe kontrollohen; asnjë shprehje inputs brenda `run`
        # (do të ishte kod shell-i i futur nga kushdo që nis workflow-n, në makinën tënde).
        env:
          URL: ${{ inputs.snapshot_url }}
          SLOTS: ${{ inputs.slots }}
          UPDATES: ${{ inputs.updates }}
          PROOFS: ${{ inputs.proofs }}
          COLD: ${{ inputs.cold }}
          RPC_CLIENTS: ${{ inputs.rpc_clients }}
          RPC_SECONDS: ${{ inputs.rpc_seconds }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          bad() { echo "input i pavlefshëm: $1='$2'" >&2; exit 2; }
          [[ $URL =~ ^https?://[A-Za-z0-9._~:/?#@%+=,\&-]+$ ]] || bad snapshot_url "$URL"
          [[ $SLOTS =~ ^[0-9]{1,7}$ ]] || bad slots "$SLOTS"
          [[ $UPDATES =~ ^[0-9]{1,9}(,[0-9]{1,9})*$ ]] || bad updates "$UPDATES"
          [[ $PROOFS =~ ^[0-9]{1,9}$ ]] || bad proofs "$PROOFS"
          [[ $COLD =~ ^(none|profile|slot)$ ]] || bad cold "$COLD"
          RPC=()
          if [ -n "$RPC_CLIENTS" ]; then
            [[ $RPC_CLIENTS =~ ^[0-9]{1,5}(,[0-9]{1,5})*$ ]] || bad rpc_clients "$RPC_CLIENTS"
            [[ $RPC_SECONDS =~ ^[0-9]{1,5}$ ]] || bad rpc_seconds "$RPC_SECONDS"
            RPC=(--rpc-clients "$RPC_CLIENTS" --rpc-seconds "$RPC_SECONDS" --rpc-one-ip)
          fi
          # Dosje e re për çdo ekzekutim (bench-i s'fshin asgjë që s'e krijoi).
          # G27: edhe numri i përpjekjes: "Re-run" i të njëjtit ekzekutim merr një dosje të re, pasi bench-i
          # refuzon një dosje DB jo bosh.
          W="${ZILJA_BENCH_DIR:-$HOME/zilja-bench}/run-$RUN_ID-$RUN_ATTEMPT"
          mkdir -p "$W/out"
          echo "W=$W" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 "$URL" | ./target/release/zilja-snapshot-bench - "$W/db" \
            --out "$W/out/results.csv" --cache-depth 20 --slots "$SLOTS" \
            --updates "$UPDATES" --proofs "$PROOFS" --cold "$COLD" "${RPC[@]}" > "$W/out/stdout.json"
          st=("${PIPESTATUS[@]}")
          [ "${st[0]}" = 0 ] || { echo "curl dështoi (${st[0]})"; exit "${st[0]}"; }
          [ "${st[1]}" = 0 ] || exit "${st[1]}"
          python3 scripts/plot-bench.py "$W/out/results.csv"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot-bench-full
          path: ${{ env.W }}/out
