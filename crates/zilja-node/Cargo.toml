[package]
name = "zilja-node"
description = "Logjika e Ziles pa validator: ndjekja e sloteve dhe fork-eve, përditësimi i pemës, RPC i dëftesave"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zilja-verifier = { workspace = true, features = ["attest"] }
ed25519-dalek = { workspace = true }
zilja-tree = { workspace = true }
crossbeam-channel = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
log = { workspace = true }


[dev-dependencies]
rand = { workspace = true }
# A21: testet e motorit të vjetër (disk_service) kërkojnë RocksDB; release-i s'e përfshin.
zilja-store = { workspace = true, features = ["rocksdb"] }
rocksdb = { version = "0.24", default-features = false, features = ["lz4"] }
tempfile = "3"
