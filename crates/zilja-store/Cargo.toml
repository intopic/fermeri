[package]
name = "zilja-store"
description = "Pema e Ziles në disk (RocksDB ose skedar faqesh), me kujtesë të sloteve të fundit"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2 = { workspace = true }
zilja-verifier = { workspace = true }
zilja-tree = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
ahash = "0.8"
crc32fast = "1"
serde_json = { workspace = true }
bs58 = { workspace = true }
rocksdb = { version = "0.24", default-features = false, features = ["lz4"] }

[dev-dependencies]
rand = { workspace = true }
tempfile = "3"
