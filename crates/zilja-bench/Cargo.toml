[package]
name = "zilja-bench"
description = "Matjet e Ziles me llogari sintetike"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zilja-verifier = { workspace = true, features = ["attest"] }
ed25519-dalek = { workspace = true }
zilja-tree = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
zilja-node = { workspace = true }
# A21: bench-et krahasojnë edhe motorin e vjetër RocksDB.
zilja-store = { workspace = true, features = ["rocksdb"] }
hex = { workspace = true }
bs58 = { workspace = true }
base64 = "0.22"

[[bin]]
name = "zilja-bench"
path = "src/main.rs"

[[bin]]
name = "zilja-rpc-bench"
path = "src/rpc_bench.rs"

[[bin]]
name = "zilja-vectors"
path = "src/vectors.rs"

[[bin]]
name = "zilja-wire-vectors"
path = "src/wire_vectors.rs"

[[bin]]
name = "zilja-fuzz"
path = "src/fuzz.rs"

[[bin]]
name = "zilja-stream-bench"
path = "src/stream_bench.rs"

[[bin]]
name = "zilja-crash-test"
path = "src/crash_test.rs"

[[bin]]
name = "zilja-disk-bench"
path = "src/disk_bench.rs"

[dev-dependencies]
tempfile = "3"
