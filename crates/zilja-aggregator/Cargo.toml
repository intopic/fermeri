[package]
name = "zilja-aggregator"
description = "Mbledhës i pabesuar i firmave të zileve: një thirrje në vend të N (R5-3)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "zilja-aggregator"
path = "src/main.rs"

[dependencies]
zilja-node = { workspace = true }
zilja-cli = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
zilja-verifier = { workspace = true, features = ["attest"] }
zilja-tree = { workspace = true }
ed25519-dalek = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
