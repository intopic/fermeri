[package]
name = "zilja-cli"
description = "Banori: verifikon një llogari Solana kundër Ziles, pa i besuar RPC-së"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "zilja-check"
path = "src/main.rs"

[[bin]]
name = "zilja-quorum"
path = "src/quorum.rs"

[[bin]]
name = "zilja-authorize"
path = "src/authorize.rs"

[dependencies]
zilja-verifier = { workspace = true, features = ["attest"] }
ed25519-dalek = { workspace = true }
serde_json = { workspace = true }
bs58 = { workspace = true }
hex = { workspace = true }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
base64 = "0.22"

[dev-dependencies]
zilja-tree = { workspace = true }
